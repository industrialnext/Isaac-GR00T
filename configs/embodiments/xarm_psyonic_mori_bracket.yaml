name: xarm_psyonic_mori_bracket

source:
  root: data/training_data/xarm_psyonic/mori_bracket_v1
  subsets: [xarm_psyonic, manus_vive]
  episode_glob: "20*/*/*/*/episode.h5"
  exclude_path_contains: ["_failed_recordings"]
  fps: 50

output:
  root: data/training_data/gr00t/xarm_psyonic_mori_bracket_v1_20260821
  robot_type: xarm_psyonic
  strip_subset_prefix: ""
  val_every: 20
  chunks_size: 1000

cameras:
  front: static_center_rgb
  wrist: eoat_right_bottom_rgb

video:
  codec: libx264
  crf: 23
  preset: veryfast
  pixel_format: yuv420p

state:
  - key: right_eef
    fields: [right_arm_pose_pos, right_arm_pose_rot]
    rot6d: source_columns_to_groot_rows
  - {key: right_hand, fields: [right_hand]}

action:
  source: observation
  observation_offset: 1
  horizon: 40
  preprocessing:
    enabled: true
    max_deviation_position: 0.002
    max_deviation_rotation: 0.01
    rotation_method: so3_tangent_qp
    skip_fields: [right_hand]
    outlier_filter:
      enabled: true
      max_repair_intervals: 32
      position_step_threshold_m: 0.020
      position_max_repaired_step_m: 0.005
      rotation_step_threshold_rad: 0.349066
      rotation_max_repaired_step_rad: 0.087266
  keys:
    - key: right_eef
      fields: [right_arm_pose_pos, right_arm_pose_rot]
      rot6d: source_columns_to_groot_rows
      rep: RELATIVE
      type: EEF
      format: XYZ_ROT6D
      state_key: right_eef
    - key: right_hand
      fields: [right_hand]
      rep: ABSOLUTE
      type: NON_EEF
      format: DEFAULT

tasks:
  id_attr: task_uuid
  text_attr: task_text
  text_overrides:
    xarm_psyonic_mori: Scoop the metal bracket from its tab side, lift it, then seat it on the alignment puck so both pegs enter their holes.

select:
  require_valid_for_training: true
  policy_types: [expert]

continuity:
  split_on_gap_ms: 40

warn:
  camera_coverage_below: 0.45
  camera_coverage_above: 0.80
  camera_age_p99_ms_above: 150
  frame_gap_ms_above: 40
  nonzero_action_residual: false

train:
  base_model: nvidia/GR00T-N1.7-3B
  out_base: outputs/gr00t
  gpus: 4
  batch: 256
  epochs: 10.0
  max_steps: null
  lr: 1.0e-4
  workers: 8
  save_steps: 1000
  save_total_limit: 10
  state_dropout_prob: 0.2
  shortest_image_edge: 256
  crop_fraction: 0.95
  color_jitter: {brightness: 0.15, contrast: 0.15, saturation: 0.2, hue: 0.1}
  use_wandb: false
  wandb_project: gr00t-xarm-psyonic-bracket
  weight_decay: 1.0e-5
  warmup_ratio: 0.05
  rtc_training_max_prefix_steps: 0

serving:
  profile: xarm_psyonic
  embodiment_tag: new_embodiment
  model_path: outputs/gr00t/xarm_psyonic_mori_bracket_20260821_045022/checkpoint-5778
  device: cuda:0
  host: 127.0.0.1
  port: 10012
  control_hz: 50
  image_size: [256, 256]
  rtc_mode: "off"
  field_lengths:
    right_arm_pose_pos: 3
    right_arm_pose_rot: 6
    right_hand: 6
  ignored_observation_keys: [static_center_depth, eoat_right_bottom_depth]
  field_units:
    right_arm_pose_pos: m
    right_arm_pose_rot: rot6d_columns
    right_hand: rad
  eef_frame: deployment_configured
  supported_rtc_modes: ["off"]
  gripper_action_keys: []
