name: semihumanoid

source:
  # Frozen local inventory cutoff: 2026-08-20T18:25:53Z.
  # Two stat inventories matched (2,352 episode.h5 files), with no open source HDF5 files.
  # Inventory digest: 822ba5c16ca2bea87bccb6e80c6fb8cf2fab058fc76e117d2dbb5caeb2e3645b.
  root: ~/ml_data/data/training_data/semihumanoid
  subsets:
    - flexiv_matcha_v2
    - flexiv_matcha_v3
    - flexiv_matcha_v4
    - flexiv_ube_v1
    - flexiv_ube_v2
    - flexiv_ube_v3
    - flexiv_ube_v4
  episode_glob: "*/20*/*/*/*/episode.h5"
  exclude_path_contains: ["_failed_recordings"]
  fps: 50

output:
  root: ~/ml_data/data/training_data/gr00t/semihumanoid_all_20260820
  robot_type: semihumanoid_bimanual
  strip_subset_prefix: "flexiv_"
  val_every: 20
  chunks_size: 1000

cameras:
  head: head_rgb
  left_wrist: eoat_left_bottom_rgb
  right_wrist: eoat_right_bottom_rgb

video:
  codec: libx264
  crf: 23
  preset: veryfast
  pixel_format: yuv420p

state:
  - key: left_eef
    fields: [left_arm_pose_pos, left_arm_pose_rot]
    rot6d: source_columns_to_groot_rows
  - {key: left_gripper, fields: [left_gripper]}
  - {key: left_ft, fields: [left_ft]}
  - key: right_eef
    fields: [right_arm_pose_pos, right_arm_pose_rot]
    rot6d: source_columns_to_groot_rows
  - {key: right_gripper, fields: [right_gripper]}
  - {key: right_ft, fields: [right_ft]}

action:
  source: executed
  horizon: 40
  keys:
    - key: left_eef
      fields: [left_arm_pose_pos, left_arm_pose_rot]
      rot6d: source_columns_to_groot_rows
      rep: RELATIVE
      type: EEF
      format: XYZ_ROT6D
      state_key: left_eef
    - key: left_gripper
      fields: [left_gripper]
      rep: ABSOLUTE
      type: NON_EEF
      format: DEFAULT
    - key: right_eef
      fields: [right_arm_pose_pos, right_arm_pose_rot]
      rot6d: source_columns_to_groot_rows
      rep: RELATIVE
      type: EEF
      format: XYZ_ROT6D
      state_key: right_eef
    - key: right_gripper
      fields: [right_gripper]
      rep: ABSOLUTE
      type: NON_EEF
      format: DEFAULT

tasks:
  id_attr: task_uuid
  text_attr: task_text
  text_overrides:
    generic_pick: Pick the grounded target object and hold it securely in the gripper.
    generic_place: Place the currently held object at the grounded destination and release it.
    bracket_handover: Hand over the bracket from the gripper holding it to the opposite gripper and secure it in the receiving gripper.

select:
  require_valid_for_training: true
  policy_types: [expert]

warn:
  camera_coverage_below: 0.45
  camera_coverage_above: 0.80
  camera_age_p99_ms_above: 150
  frame_gap_ms_above: 40
  nonzero_action_residual: true

continuity:
  split_on_gap_ms: 40

train:
  base_model: nvidia/GR00T-N1.7-3B
  out_base: ~/ml_data/outputs/gr00t
  gpus: 4
  batch: 256
  epochs: null
  max_steps: 40000
  lr: 2.8e-4
  workers: 8
  save_steps: 10000
  save_total_limit: 2
  state_dropout_prob: 0.2
  shortest_image_edge: 256
  crop_fraction: 0.95
  color_jitter: {brightness: 0.15, contrast: 0.15, saturation: 0.2, hue: 0.1}
  use_wandb: false
  wandb_project: gr00t-semihumanoid
  weight_decay: 1.0e-5
  warmup_ratio: 0.05
  rtc_training_max_prefix_steps: 12

serving:
  profile: semihumanoid
  embodiment_tag: new_embodiment
  model_path: ~/ml_data/outputs/gr00t/semihumanoid_latest/checkpoint-40000
  device: cuda:0
  host: 127.0.0.1
  port: 10012
  control_hz: 50
  image_size: [256, 256]
  rtc_mode: "off"
  field_lengths:
    left_arm_pose_pos: 3
    left_arm_pose_rot: 6
    left_gripper: 1
    left_ft: 6
    right_arm_pose_pos: 3
    right_arm_pose_rot: 6
    right_gripper: 1
    right_ft: 6
  ignored_observation_keys: [head_depth, eoat_left_bottom_depth, eoat_right_bottom_depth]
  field_units:
    left_arm_pose_pos: m
    left_arm_pose_rot: rot6d_columns
    left_gripper: normalized
    left_ft: sensor_native
    right_arm_pose_pos: m
    right_arm_pose_rot: rot6d_columns
    right_gripper: normalized
    right_ft: sensor_native
  eef_frame: deployment_configured
  supported_rtc_modes: ["off", native, trained_prefix]
  gripper_action_keys: [left_gripper, right_gripper]
